<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <div class="nav-left">
                <a href="#" class="logo">Umeå</a>
                <nav>
                    <ul class="hmenu">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Shop</a></li>
                        <li><a href="#">Blog</a></li>
                        <li><a href="#">Category</a></li>
                        <li><a href="#">About</a></li>
                    </ul>
                </nav>
            </div>

            <form class="header-form" action="#" method="POST">
                <input type="email" placeholder="Enter email address..." required>
                <button type="submit" class="btn-contact">Contact Us</button>
            </form>
        </div>
    </header>

    <section class="banner">
        <a href="#" class="banner-link">
            <img src="./img/banner.jpg" alt="Main Banner" class="banner-img">
        </a>
    </section>

    <section class="categories section-padding">
        <div class="container grid-3">
            <a href="#" class="category-card">RECYCLED</a>
            <a href="#" class="category-card">CUSTOM</a>
            <a href="#" class="category-card">HANDMADE</a>
        </div>
    </section>

    <section class="team section-padding">
        <div class="container">
            <p class="sub-title">OUR CREATIVE FORCE</p>
            <h2 class="section-title">Meet our team</h2>
            
            <div class="grid-4">
                <div class="team-card">
                    <a href="#" class="team-img-link">
                        <img src="./img/member1.jpg" alt="Yeung Ngai">
                    </a>
                    <h3 class="member-name"><a href="#">Yeung Ngai</a></h3>
                    <p class="member-role">DESIGNER</p>
                </div>

                <div class="team-card">
                    <a href="#" class="team-img-link">
                        <img src="./img/member2.jpg" alt="Nicolas Waldau">
                    </a>
                    <h3 class="member-name"><a href="#">Nicolas Waldau</a></h3>
                    <p class="member-role">ARCHITECT</p>
                </div>

                <div class="team-card">
                    <a href="#" class="team-img-link">
                        <img src="./img/member3.jpg" alt="Juliette Massé">
                    </a>
                    <h3 class="member-name"><a href="#">Juliette Massé</a></h3>
                    <p class="member-role">STORE MANAGER</p>
                </div>

                <div class="team-card">
                    <a href="#" class="team-img-link">
                        <img src="./img/member4.jpg" alt="Nicolette Ritonni">
                    </a>
                    <h3 class="member-name"><a href="#">Nicolette Ritonni</a></h3>
                    <p class="member-role">FINE CERAMICS</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-container">
            <a href="#" class="footer-logo">Umeå</a>
            <p class="copyright">&copy; 2026 All Rights Reserved</p>
        </div>
    </footer>

</body>
</html>
